    <!-- SafeStorage ラッパー (Google Sites / iframe 等での Storage アクセス拒否対策) -->
    <script>
        window.safeStorage = {
            _memory: {},
            getItem: function(key) {
                try {
                    return localStorage.getItem(key);
                } catch (e) {
                    return this._memory[key] || null;
                }
            },
            setItem: function(key, value) {
                try {
                    localStorage.setItem(key, value);
                } catch (e) {
                    this._memory[key] = value;
                }
            },
            removeItem: function(key) {
                try {
                    localStorage.removeItem(key);
                } catch (e) {
                    delete this._memory[key];
                }
            }
        };
    </script>

    <!-- Firebase SDK 11.6.1 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // 【重要】異なる端末間（先生PC ⇄ 児童タブレット等）でリアルタイム同期を行う場合
        // Firebaseコンソール (https://console.firebase.google.com/) で無料プロジェクトを
        // 作成し、取得した設定情報（apiKey, projectId等）をここに貼り付けてください。
        // =========================================================================
        const DEFAULT_FIREBASE_CONFIG = {
            apiKey: "demo-key",
            authDomain: "demo-project.firebaseapp.com",
            projectId: "demo-project",
            storageBucket: "demo-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sch-check-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : DEFAULT_FIREBASE_CONFIG;

        let auth, db;
        const isConfigured = firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey !== 'demo-key';

        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.warn("Firebase Init notice:", e);
        }

        window.FirebaseBridge = {
            isConfigured,
            initAuth: async () => {
                if (!auth) return null;
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    return auth.currentUser;
                } catch (e) {
                    console.warn("Firebase Auth fallback:", e);
                    return null;
                }
            },
            db,
            appId,
            doc,
            setDoc,
            getDoc,
            collection,
            onSnapshot,

            saveMasterData: async (masterObj) => {
                if (!db) return;
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'master');
                    await setDoc(docRef, {
                        ...masterObj,
                        updatedAt: new Date().toISOString()
                    }, { merge: true });
                } catch (e) {
                    console.warn("Firestore save master error:", e);
                }
            },

            listenMasterData: (callback) => {
                if (!db) return () => {};
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'master');
                return onSnapshot(docRef, (snapshot) => {
                    if (snapshot.exists()) {
                        callback(snapshot.data());
                    }
                }, (err) => {
                    console.warn("Firestore master snapshot notice:", err);
                });
            },

            saveSubmissionDoc: async (docId, subObj) => {
                if (!db) return;
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'submissions', docId);
                    await setDoc(docRef, subObj, { merge: true });
                } catch (e) {
                    console.warn("Firestore submission save error:", e);
                }
            }
        };
    </script>

        const INITIAL_PRESET_LIST = [
            {
                id: 'preset-mon',
                name: '月曜日セット',
                ruby: 'げつようびセット',
                items: [
                    { title: '上履き', ruby: 'うわばき', categoryId: 'cat-special', tab: 'daily', note: '洗ったきれいなもの' },
                    { title: '体操服', ruby: 'たいそうふく', categoryId: 'cat-special', tab: 'daily', note: '赤白帽子も' },
                    { title: '給食着', ruby: 'きゅうしょくぎ', categoryId: 'cat-special', tab: 'daily', note: '当番の人' },
                ]
            }
        ];

        const getResetCutoffTimestamp = (dateObj = new Date()) => {
            const cutoff = new Date(dateObj);
            cutoff.setHours(15, 0, 0, 0);
            if (dateObj < cutoff) {
                cutoff.setDate(cutoff.getDate() - 1);
            }
            return cutoff.getTime();
        };

        const getTodayKey = () => {
            const now = new Date();
            const cutoff = new Date(now);
            cutoff.setHours(15, 0, 0, 0);
            if (now < cutoff) {
                cutoff.setDate(cutoff.getDate() - 1);
            }
            return `${cutoff.getFullYear()}-${String(cutoff.getMonth() + 1).padStart(2, '0')}-${String(cutoff.getDate()).padStart(2, '0')}`;
        };

        function App() {
            const [categories, setCategories] = useState(() => {
                const saved = window.safeStorage.getItem('sch_chk_categories');
                return saved ? JSON.parse(saved) : INITIAL_CATEGORIES;
            });

            const [items, setItems] = useState(() => {
                const saved = window.safeStorage.getItem('sch_chk_items');
                return saved ? JSON.parse(saved) : INITIAL_ITEMS;
            });

            const [presets, setPresets] = useState(() => {
                const saved = window.safeStorage.getItem('sch_chk_presets');
                return saved ? JSON.parse(saved) : INITIAL_PRESET_LIST;
            });

            const [roster, setRoster] = useState(() => {
                const saved = window.safeStorage.getItem('sch_chk_roster');
                return saved ? JSON.parse(saved) : INITIAL_ROSTER;
            });

            const [passcode, setPasscode] = useState(() => {
                return window.safeStorage.getItem('sch_chk_passcode') || '1234';
            });

            const [lastResetTime, setLastResetTime] = useState(() => {
                const saved = window.safeStorage.getItem('sch_chk_last_reset');
                return saved ? Number(saved) : 0;
            });

            const [selectedStudentId, setSelectedStudentId] = useState(() => {
                const saved = window.safeStorage.getItem('sch_chk_selected_st');
                return saved || (roster[0]?.id || '');
            });

            const [submissions, setSubmissions] = useState(() => {
                const saved = window.safeStorage.getItem('sch_chk_submissions');
                return saved ? JSON.parse(saved) : {};
            });

            const [activeTab, setActiveTab] = useState('daily');
            const [isTeacherMode, setIsTeacherMode] = useState(false);
            const [activeView, setActiveView] = useState('list');

            // モーダル管理ステート
            const [showPasscodeModal, setShowPasscodeModal] = useState(false);
            const [passcodeInput, setPasscodeInput] = useState('');
            const [passcodeError, setPasscodeError] = useState('');

            const [showChangePassModal, setShowChangePassModal] = useState(false);
            const [oldPassInput, setOldPassInput] = useState('');
            const [newPassInput, setNewPassInput] = useState('');
            const [confirmPassInput, setConfirmPassInput] = useState('');
            const [changePassError, setChangePassError] = useState('');

            const [showItemModal, setShowItemModal] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [itemFormData, setItemFormData] = useState({
                title: '', ruby: '', categoryId: 'cat-daily', tab: 'daily', note: ''
            });

            const [showCategoryModal, setShowCategoryModal] = useState(false);
            const [editingCategory, setEditingCategory] = useState(null);
            const [catFormData, setCatFormData] = useState({
                name: '', ruby: '', icon: 'fa-bag-shopping', colorIndex: 0
            });

            const [showSavePresetModal, setShowSavePresetModal] = useState(false);
            const [presetNameInput, setPresetNameInput] = useState('');
            const [presetRubyInput, setPresetRubyInput] = useState('');

            const [showPresetManagerModal, setShowPresetManagerModal] = useState(false);
            const [showRosterModal, setShowRosterModal] = useState(false);
            const [editingStudent, setEditingStudent] = useState(null);
            const [studentFormData, setStudentFormData] = useState({ number: 1, name: '', ruby: '' });

            const [dialogConfig, setDialogConfig] = useState(null);

            const COLOR_THEMES = [
                { color: 'bg-amber-100 border-amber-300 text-amber-900', badge: 'bg-amber-500 text-white', label: 'アンバー' },
                { color: 'bg-sky-100 border-sky-300 text-sky-900', badge: 'bg-sky-500 text-white', label: 'スカイブルー' },
                { color: 'bg-rose-100 border-rose-300 text-rose-900', badge: 'bg-rose-500 text-white', label: 'ローズ' },
                { color: 'bg-emerald-100 border-emerald-300 text-emerald-900', badge: 'bg-emerald-500 text-white', label: 'エメラルド' },
                { color: 'bg-purple-100 border-purple-300 text-purple-900', badge: 'bg-purple-500 text-white', label: 'パープル' },
                { color: 'bg-slate-100 border-slate-300 text-slate-900', badge: 'bg-slate-600 text-white', label: 'グレー' },
            ];

            const ICON_OPTIONS = [
                'fa-bag-shopping', 'fa-book-open', 'fa-file-signature', 'fa-star', 
                'fa-palette', 'fa-music', 'fa-volleyball', 'fa-flask', 'fa-pencil', 'fa-laptop'
            ];

            const todayKey = getTodayKey();

            // リアルタイム同期の受信リスナー設定
            useEffect(() => {
                let unsubSubmissions = null;
                let unsubMaster = null;

                const setupFirebase = async () => {
                    if (window.FirebaseBridge) {
                        const { initAuth, db, appId, collection, onSnapshot, listenMasterData } = window.FirebaseBridge;
                        await initAuth();

                        // A. クラウド上のマスターデータ（持ち物・カテゴリ・名簿等）の同期受領
                        unsubMaster = listenMasterData((data) => {
                            if (!data) return;
                            if (data.categories && data.categories.length > 0) {
                                setCategories(data.categories);
                                window.safeStorage.setItem('sch_chk_categories', JSON.stringify(data.categories));
                            }
                            if (data.items && data.items.length > 0) {
                                setItems(prev => {
                                    const completedMap = new Map(prev.map(i => [i.id, i.completed]));
                                    const merged = data.items.map(it => ({
                                        ...it,
                                        completed: completedMap.has(it.id) ? completedMap.get(it.id) : false
                                    }));
                                    window.safeStorage.setItem('sch_chk_items', JSON.stringify(merged));
                                    return merged;
                                });
                            }
                            if (data.presets) {
                                setPresets(data.presets);
                                window.safeStorage.setItem('sch_chk_presets', JSON.stringify(data.presets));
                            }
                            if (data.roster && data.roster.length > 0) {
                                setRoster(data.roster);
                                window.safeStorage.setItem('sch_chk_roster', JSON.stringify(data.roster));
                            }
                            if (data.passcode) {
                                setPasscode(data.passcode);
                                window.safeStorage.setItem('sch_chk_passcode', data.passcode);
                            }
                        });

                        // B. 全児童の提出・チェック状況の同期受領
                        if (db) {
                            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'submissions');
                            unsubSubmissions = onSnapshot(colRef, (snapshot) => {
                                const newSubmissions = {};
                                snapshot.forEach((doc) => {
                                    newSubmissions[doc.id] = doc.data();
                                });
                                setSubmissions(prev => {
                                    const updated = { ...prev, ...newSubmissions };
                                    window.safeStorage.setItem('sch_chk_submissions', JSON.stringify(updated));
                                    return updated;
                                });
                            }, (err) => {
                                console.warn("Firestore submissions snapshot notice:", err);
                            });
                        }
                    }
                };
                setupFirebase();

                return () => {
                    if (unsubSubmissions) unsubSubmissions();
                    if (unsubMaster) unsubMaster();
                };
            }, []);

            // マスターデータ更新時のクラウド送信処理
            const persistMasterData = (updatedObj) => {
                const masterObj = {
                    categories: updatedObj.categories !== undefined ? updatedObj.categories : categories,
                    items: updatedObj.items !== undefined ? updatedObj.items : items,
                    presets: updatedObj.presets !== undefined ? updatedObj.presets : presets,
                    roster: updatedObj.roster !== undefined ? updatedObj.roster : roster,
                    passcode: updatedObj.passcode !== undefined ? updatedObj.passcode : passcode,
                };

                window.safeStorage.setItem('sch_chk_categories', JSON.stringify(masterObj.categories));
                window.safeStorage.setItem('sch_chk_items', JSON.stringify(masterObj.items));
                window.safeStorage.setItem('sch_chk_presets', JSON.stringify(masterObj.presets));
                window.safeStorage.setItem('sch_chk_roster', JSON.stringify(masterObj.roster));
                window.safeStorage.setItem('sch_chk_passcode', masterObj.passcode);

                if (window.FirebaseBridge) {
                    window.FirebaseBridge.saveMasterData(masterObj);
                }
            };

            // 毎日15:00の自動リセット
            useEffect(() => {
                const nowCutoff = getResetCutoffTimestamp(new Date());
                if (lastResetTime < nowCutoff) {
                    setItems(prev => {
                        const resetItems = prev.map(item => item.tab === 'daily' ? { ...item, completed: false } : item);
                        window.safeStorage.setItem('sch_chk_items', JSON.stringify(resetItems));
                        return resetItems;
                    });
                    setLastResetTime(nowCutoff);
                    window.safeStorage.setItem('sch_chk_last_reset', String(nowCutoff));
                }
            }, [lastResetTime]);

            const currentSubKey = `${todayKey}_${selectedStudentId}`;
            const currentSubData = submissions[currentSubKey] || { checkedIds: [], isSubmitted: false, submittedAt: '' };

            // 児童選択時、および他端末からの提出データ更新時に画面のチェック状態を同期
            useEffect(() => {
                if (!selectedStudentId) return;
                window.safeStorage.setItem('sch_chk_selected_st', selectedStudentId);
                const checkedSet = new Set(currentSubData.checkedIds || []);
                setItems(prev => prev.map(it => ({
                    ...it,
                    completed: checkedSet.has(it.id)
                })));
            }, [selectedStudentId, currentSubKey, JSON.stringify(currentSubData.checkedIds)]);

            const showNotice = (title, message) => setDialogConfig({ type: 'notice', title, message });
            const showConfirm = (title, message, onConfirm) => setDialogConfig({ type: 'confirm', title, message, onConfirm });

            // 児童のチェック操作
            const toggleItemCheck = (id) => {
                if (isTeacherMode) return;
                setItems(prev => {
                    const nextItems = prev.map(item => item.id === id ? { ...item, completed: !item.completed } : item);
                    saveCurrentCheckState(nextItems, currentSubData.isSubmitted, currentSubData.submittedAt);
                    return nextItems;
                });
            };

            // チェック状態・提出状態の即時同期
            const saveCurrentCheckState = (updatedItems, isSubmittedStatus, submittedAtTime) => {
                if (!selectedStudentId) return;
                const checkedIds = updatedItems.filter(i => i.completed).map(i => i.id);
                const subObj = {
                    studentId: selectedStudentId,
                    dateKey: todayKey,
                    checkedIds,
                    isSubmitted: isSubmittedStatus,
                    submittedAt: submittedAtTime,
                    updatedAt: new Date().toISOString()
                };

                setSubmissions(prev => {
                    const updated = { ...prev, [currentSubKey]: subObj };
                    window.safeStorage.setItem('sch_chk_submissions', JSON.stringify(updated));
                    return updated;
                });

                if (window.FirebaseBridge) {
                    window.FirebaseBridge.saveSubmissionDoc(currentSubKey, subObj);
                }
            };

            // 先生モード：マトリクス表セル代理操作
            const toggleMatrixCell = (stId, itemId) => {
                if (!isTeacherMode) return;
                const targetSubKey = `${todayKey}_${stId}`;
                const targetSub = submissions[targetSubKey] || { checkedIds: [], isSubmitted: false, submittedAt: '' };
                const checkedSet = new Set(targetSub.checkedIds || []);

                if (checkedSet.has(itemId)) {
                    checkedSet.delete(itemId);
                } else {
                    checkedSet.add(itemId);
                }

                const updatedSub = {
                    studentId: stId,
                    dateKey: todayKey,
                    checkedIds: Array.from(checkedSet),
                    isSubmitted: targetSub.isSubmitted,
                    submittedAt: targetSub.submittedAt,
                    updatedAt: new Date().toISOString()
                };

                setSubmissions(prev => {
                    const next = { ...prev, [targetSubKey]: updatedSub };
                    window.safeStorage.setItem('sch_chk_submissions', JSON.stringify(next));
                    return next;
                });

                if (window.FirebaseBridge) {
                    window.FirebaseBridge.saveSubmissionDoc(targetSubKey, updatedSub);
                }

                if (stId === selectedStudentId) {
                    setItems(prev => prev.map(it => ({
                        ...it,
                        completed: checkedSet.has(it.id)
                    })));
                }
            };

            const toggleMatrixSubmission = (stId) => {
                if (!isTeacherMode) return;
                const targetSubKey = `${todayKey}_${stId}`;
                const targetSub = submissions[targetSubKey] || { checkedIds: [], isSubmitted: false, submittedAt: '' };
                const now = new Date();
                const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                const updatedSub = {
                    ...targetSub,
                    studentId: stId,
                    dateKey: todayKey,
                    isSubmitted: !targetSub.isSubmitted,
                    submittedAt: !targetSub.isSubmitted ? timeStr : '',
                    updatedAt: new Date().toISOString()
                };

                setSubmissions(prev => {
                    const next = { ...prev, [targetSubKey]: updatedSub };
                    window.safeStorage.setItem('sch_chk_submissions', JSON.stringify(next));
                    return next;
                });

                if (window.FirebaseBridge) {
                    window.FirebaseBridge.saveSubmissionDoc(targetSubKey, updatedSub);
                }
            };

            const handleSubmitChecklist = () => {
                if (!selectedStudentId) {
                    showNotice('おなまえの選択', 'じぶんの おなまえを えらんでから ていしゅつしてください。');
                    return;
                }
                const now = new Date();
                const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                saveCurrentCheckState(items, true, timeStr);
                showNotice('ていしゅつ かんりょう', `せんせいに ていしゅつしました。（${timeStr}）`);
            };

            const handleChangePasscodeSubmit = (e) => {
                e.preventDefault();
                if (oldPassInput !== passcode) {
                    setChangePassError('現在の暗証番号が違います。');
                    return;
                }
                if (newPassInput.length < 4) {
                    setChangePassError('新しい暗証番号は4桁以上にしてください。');
                    return;
                }
                if (newPassInput !== confirmPassInput) {
                    setChangePassError('新しい暗証番号（確認）が一致しません。');
                    return;
                }
                setPasscode(newPassInput);
                persistMasterData({ passcode: newPassInput });
                setShowChangePassModal(false);
                showNotice('暗証番号変更', '暗証番号を正常に変更・保存しました。');
            };

            const moveItemOrder = (itemId, direction) => {
                const idx = items.findIndex(i => i.id === itemId);
                if (idx < 0) return;
                const targetIdx = direction === 'up' ? idx - 1 : idx + 1;
                if (targetIdx < 0 || targetIdx >= items.length) return;
                const updated = [...items];
                const [moved] = updated.splice(idx, 1);
                updated.splice(targetIdx, 0, moved);
                setItems(updated);
                persistMasterData({ items: updated });
            };

            const moveCategoryOrder = (catId, direction) => {
                const idx = categories.findIndex(c => c.id === catId);
                if (idx < 0) return;
                const targetIdx = direction === 'up' ? idx - 1 : idx + 1;
                if (targetIdx < 0 || targetIdx >= categories.length) return;
                const updated = [...categories];
                const [moved] = updated.splice(idx, 1);
                updated.splice(targetIdx, 0, moved);
                setCategories(updated);
                persistMasterData({ categories: updated });
            };

            const openAddItemModal = (catId = null) => {
                setEditingItem(null);
                setItemFormData({
                    title: '',
                    ruby: '',
                    categoryId: catId || categories[0]?.id || 'cat-daily',
                    tab: activeTab,
                    note: ''
                });
                setShowItemModal(true);
            };

            const openEditItemModal = (item) => {
                setEditingItem(item);
                setItemFormData({
                    title: item.title,
                    ruby: item.ruby || '',
                    categoryId: item.categoryId,
                    tab: item.tab,
                    note: item.note || ''
                });
                setShowItemModal(true);
            };

            const handleItemFormSubmit = (e) => {
                e.preventDefault();
                if (!itemFormData.title.trim()) return;

                let nextItems;
                if (editingItem) {
                    nextItems = items.map(i => i.id === editingItem.id ? {
                        ...i,
                        title: itemFormData.title.trim(),
                        ruby: itemFormData.ruby.trim(),
                        categoryId: itemFormData.categoryId,
                        tab: itemFormData.tab,
                        note: itemFormData.note.trim()
                    } : i);
                } else {
                    const newItem = {
                        id: 'item-' + Date.now(),
                        title: itemFormData.title.trim(),
                        ruby: itemFormData.ruby.trim(),
                        categoryId: itemFormData.categoryId,
                        tab: itemFormData.tab,
                        note: itemFormData.note.trim(),
                        completed: false
                    };
                    nextItems = [...items, newItem];
                }
                setItems(nextItems);
                persistMasterData({ items: nextItems });
                setShowItemModal(false);
            };

            const deleteItem = (itemId) => {
                if (!isTeacherMode) return;
                showConfirm('削除の確認', 'この持ち物をリストから削除してもよろしいですか？', () => {
                    const nextItems = items.filter(i => i.id !== itemId);
                    setItems(nextItems);
                    persistMasterData({ items: nextItems });
                });
            };

            const openAddCategoryModal = () => {
                setEditingCategory(null);
                setCatFormData({ name: '', ruby: '', icon: 'fa-bag-shopping', colorIndex: 0 });
                setShowCategoryModal(true);
            };

            const openEditCategoryModal = (cat) => {
                setEditingCategory(cat);
                const colorIdx = COLOR_THEMES.findIndex(t => t.color === cat.color);
                setCatFormData({
                    name: cat.name,
                    ruby: cat.ruby || '',
                    icon: cat.icon,
                    colorIndex: colorIdx >= 0 ? colorIdx : 0
                });
                setShowCategoryModal(true);
            };

            const handleCategoryFormSubmit = (e) => {
                e.preventDefault();
                if (!catFormData.name.trim()) return;
                const theme = COLOR_THEMES[catFormData.colorIndex];

                let nextCats;
                if (editingCategory) {
                    nextCats = categories.map(c => c.id === editingCategory.id ? {
                        ...c,
                        name: catFormData.name.trim(),
                        ruby: catFormData.ruby.trim(),
                        icon: catFormData.icon,
                        color: theme.color,
                        badge: theme.badge
                    } : c);
                } else {
                    const newCat = {
                        id: 'cat-' + Date.now(),
                        name: catFormData.name.trim(),
                        ruby: catFormData.ruby.trim(),
                        icon: catFormData.icon,
                        color: theme.color,
                        badge: theme.badge
                    };
                    nextCats = [...categories, newCat];
                }
                setCategories(nextCats);
                persistMasterData({ categories: nextCats });
                setShowCategoryModal(false);
            };

            const deleteCategory = (catId) => {
                if (!isTeacherMode) return;
                const catItems = items.filter(i => i.categoryId === catId);
                const msg = catItems.length > 0 
                    ? `このカテゴリに含まれる ${catItems.length} 件の持ち物も一緒に削除されます。本当に削除しますか？`
                    : 'このカテゴリを削除してもよろしいですか？';

                showConfirm('カテゴリ削除の確認', msg, () => {
                    const nextCats = categories.filter(c => c.id !== catId);
                    const nextItems = items.filter(i => i.categoryId !== catId);
                    setCategories(nextCats);
                    setItems(nextItems);
                    persistMasterData({ categories: nextCats, items: nextItems });

                const preset = presets.find(p => p.id === presetId);
                if (!preset) return;

                    `「${preset.name}」の内容で現在の「まいにちの持ち物」を書き換えますか？`,
                    () => {
                        const newItems = preset.items.map((it, idx) => ({
                            id: 'preset-' + Date.now() + '-' + idx,
                            title: it.title,
                            ruby: it.ruby || '',
                            categoryId: it.categoryId || categories[0]?.id,
                            tab: 'daily',
                            note: it.note || '',
                            completed: false
                        }));
                        const nextItems = [
                            ...items.filter(i => i.tab !== 'daily'),
                            ...newItems
                        ];
                        setItems(nextItems);
                        persistMasterData({ items: nextItems });
                    }
                );
            };

            const handleSaveCurrentAsPreset = (e) => {
                e.preventDefault();
                if (!presetNameInput.trim()) return;

                const dailyItems = items.filter(i => i.tab === 'daily');
                const newPreset = {
                    id: 'preset-' + Date.now(),
                    name: presetNameInput.trim(),
                    ruby: presetRubyInput.trim(),
                    items: dailyItems.map(i => ({
                        title: i.title,
                        ruby: i.ruby,
                        categoryId: i.categoryId,
                        note: i.note
                    }))
                };
                const nextPresets = [...presets, newPreset];
                setPresets(nextPresets);
                persistMasterData({ presets: nextPresets });
                setPresetNameInput('');
                setPresetRubyInput('');
                setShowSavePresetModal(false);
                showNotice('保存完了', `「${newPreset.name}」をプリセットに保存・全端末へ同期しました。`);

                        id: 'st-' + Date.now(),
                        number: Number(studentFormData.number),

                    setPasscodeError('');

            const verifyPasscode = (e) => {

                                </h1>
                            </div>

                            <div className="flex items-center space-x-2">

                                            activeView === 'matrix'

                                    >
                                        <i className="fa-solid fa-table-cells"></i>
                                        <span>{activeView === 'matrix' ? 'チェックリスト表示' : '全員の確認表'}</span>
                                    </button>
                                )}

                                <button
                                    onClick={handleTeacherToggle}
                                    className={`px-3 py-1.5 text-xs font-bold rounded-xl border flex items-center space-x-1 ${
                                        isTeacherMode
                                            ? 'bg-rose-500 text-white border-rose-600'
                                            : 'bg-slate-100 text-slate-700 border-slate-300 hover:bg-slate-200'
                                    }`}
                                >
                                    <i className={`fa-solid ${isTeacherMode ? 'fa-lock-open' : 'fa-lock'}`}></i>
                                    <span>{isTeacherMode ? '先生モード中' : '先生用管理'}</span>
                                </button>

                                className={`flex-1 py-2.5 px-4 rounded-xl font-bold text-sm border-2 text-center ${
                                    activeTab === 'daily'
                                        ? 'bg-amber-400 text-amber-950 border-amber-500 shadow-sm'
                                        : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                                }`}
                            >
                                まいにちの持ち物
                            </button>
                            <button
                                onClick={() => setActiveTab('keep')}
                                className={`flex-1 py-2.5 px-4 rounded-xl font-bold text-sm border-2 text-center ${
                                    activeTab === 'keep'
                                        ? 'bg-sky-400 text-sky-950 border-sky-500 shadow-sm'
                                        : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                                }`}
                            >
                                学校に置いておくもの
                            </button>
                        </div>
                    )}

                    {/* 先生用 管理パネル */}
                    {isTeacherMode && (
                        <div className="bg-rose-50 rounded-2xl border-2 border-rose-200 p-4 mb-4 shadow-sm">
                            <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
                                <div className="flex items-center space-x-2 text-rose-900 font-bold text-sm">
                                    <i className="fa-solid fa-user-gear text-rose-600"></i>
                                    <span>先生専用 管理パネル</span>
                                </div>
                                <div className="flex items-center space-x-2">
                                    {isFbConfigured ? (
                                        <span className="text-xs font-bold text-emerald-800 bg-emerald-100 px-2.5 py-0.5 rounded-full border border-emerald-300">
                                            ☁️ クラウド同期動作中
                                        </span>
                                    ) : (
                                        <span className="text-xs font-bold text-amber-800 bg-amber-100 px-2.5 py-0.5 rounded-full border border-amber-300">
                                            ⚠️ ローカル動作中（他端末同期にはFirebase設定が必要です）
                                        </span>
                                    )}
                                </div>
                            </div>
                            
                            <div className="flex flex-wrap items-center gap-2">
                                <button
                                    onClick={() => openAddItemModal()}
                                    className="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow text-xs flex items-center space-x-1"
                                >
                                    <i className="fa-solid fa-plus"></i>
                                    <span>新しい持ち物を追加</span>
                                </button>

                                <button
                                    onClick={openAddCategoryModal}
                                    className="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow text-xs flex items-center space-x-1"

                                    <i className="fa-solid fa-folder-plus"></i>
                                    <span>新しいカテゴリを追加</span>
                                </button>

                                <button
                                    onClick={() => setShowSavePresetModal(true)}
                                    className="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow text-xs flex items-center space-x-1"
                                >
                                    <i className="fa-solid fa-bookmark"></i>
                                    <span>現在のリストをプリセット保存</span>

                                <button
                                    onClick={() => setShowPresetManagerModal(true)}
                                    className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow text-xs flex items-center space-x-1"
                                >
                                    <i className="fa-solid fa-folder-gear"></i>
                                    <span>プリセット管理 ({presets.length})</span>
                                </button>

                                <button
                                    onClick={openAddStudentModal}
                                    className="px-3 py-1.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl shadow text-xs flex items-center space-x-1"
                                >
                                    <i className="fa-solid fa-users-gear"></i>
                                    <span>児童名簿の編集</span>
                                </button>

                                <button
                                    onClick={() => {
                                        setOldPassInput('');
                                        setNewPassInput('');
                                        setConfirmPassInput('');
                                        setChangePassError('');
                                        setShowChangePassModal(true);
                                    }}
                                    className="px-3 py-1.5 bg-slate-700 hover:bg-slate-800 text-white font-bold rounded-xl shadow text-xs flex items-center space-x-1"
                                >
                                    <i className="fa-solid fa-key"></i>
                                    <span>暗証番号の変更</span>

                                <span className="text-xs font-bold text-rose-900">プリセット一括上書き適用:</span>
                                {presets.map(p => (
                                    <button
                                        key={p.id}

                                        className="px-2.5 py-1 bg-white hover:bg-rose-100 text-rose-900 border border-rose-300 font-bold text-xs rounded-lg shadow-sm"

                                        ➔ {renderRubyText(p.name, p.ruby)}
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* ビュー1: チェックリスト表示 */}
                    {activeView === 'list' && (
                        <div className="space-y-4">
                            {/* カテゴリ毎のカード */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {categories.map((cat) => {
                                    const catItems = activeTabItems.filter(i => i.categoryId === cat.id);
                                    if (catItems.length === 0 && !isTeacherMode) return null;

                                    const doneCount = catItems.filter(i => i.completed).length;

                                    return (
                                        <div key={cat.id} className={`rounded-2xl border-2 p-4 shadow-sm bg-white ${cat.color.split(' ')[1]}`}>
                                            
                                            {/* カテゴリヘッダー */}
                                            <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
                                                <div className="flex items-center space-x-2.5">

                                                        <i className={`fa-solid ${cat.icon}`}></i>
                                                    </div>
                                                    <h2 className="font-black text-base text-slate-800">
                                                        {renderRubyText(cat.name, cat.ruby)}
                                                    </h2>
                                                </div>

                                                <div className="flex items-center space-x-1">

                                                    {isTeacherMode && (
                                                        <button
                                                            onClick={() => openAddItemModal(cat.id)}
                                                            className="px-2.5 py-0.5 bg-emerald-600 text-white text-xs font-bold rounded-lg"
                                                        >
                                                            + 追加
                                                        </button>

                                                <div className="space-y-2">

                                                        <div
                                                            key={item.id}

                                                                isTeacherMode ? 'cursor-default' : 'cursor-pointer hover:border-amber-400'
                                                            } ${

                                                                    : 'bg-white border-slate-200 shadow-sm'
                                                            }`}
                                                        >
                                                            <div className="flex items-center space-x-3 flex-1 min-w-0">
                                                                <div className={`w-7 h-7 rounded-lg border-2 flex items-center justify-center text-sm flex-shrink-0 ${
                                                                    item.completed
                                                                        ? 'bg-brandGreen border-brandGreen text-white'

                                                    <p className="text-[10px] text-slate-500 font-bold mt-0.5">
                                                        件数: {p.items.length}件
                                                    </p>
                                                </div>
                                                <div className="flex items-center space-x-2">
                                                    <button
                                                        onClick={() => {
                                                            applyPreset(p.id);
                                                            setShowPresetManagerModal(false);
                                                        }}
                                                        className="px-2.5 py-1 bg-emerald-600 text-white font-bold text-xs rounded-lg shadow"
                                                    >
                                                        上書き適用
                                                    </button>
                                                    <button
                                                        onClick={() => deletePreset(p.id)}
                                                        className="px-2.5 py-1 bg-rose-100 text-rose-700 hover:bg-rose-200 font-bold text-xs rounded-lg"
                                                    >
                                                        削除
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                                <div className="p-3 bg-slate-100 border-t border-slate-200 flex justify-between items-center">
                                    <button
                                        onClick={() => {
                                            setShowPresetManagerModal(false);
                                            setShowSavePresetModal(true);
                                        }}
                                        className="text-xs font-bold text-indigo-700 underline"
                                    >
                                        + プリセット追加
                                    </button>
                                    <button
                                        onClick={() => setShowPresetManagerModal(false)}
                                        className="px-4 py-1.5 bg-slate-800 text-white font-bold rounded-xl text-xs"
                                    >
                                        閉じる
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 7. 児童名簿モーダル */}
                    {showRosterModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40">
                            <div className="bg-white rounded-2xl border-2 border-teal-300 w-full max-w-sm overflow-hidden shadow-xl">
                                <div className="px-5 py-3 bg-teal-100 border-b border-teal-200 flex items-center justify-between">
                                    <h3 className="font-bold text-teal-900 text-sm">
                                        {editingStudent ? '児童情報の修正' : '児童の追加'}
                                    </h3>
                                    <button onClick={() => setShowRosterModal(false)} className="text-teal-900 font-bold">✕</button>
                                </div>
                                <form onSubmit={handleStudentFormSubmit} className="p-5 space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">出席番号</label>
                                        <input
                                            type="number"
                                            required
                                            min="1"
                                            value={studentFormData.number}
                                            onChange={e => setStudentFormData({ ...studentFormData, number: e.target.value })}
                                            className="w-full px-3 py-1.5 text-sm border-2 border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">児童の氏名 <span className="text-rose-500">*</span></label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="例: 山田 たろう"
                                            value={studentFormData.name}
                                            onChange={e => setStudentFormData({ ...studentFormData, name: e.target.value })}
                                            className="w-full px-3 py-1.5 text-sm border-2 border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">ふりがな</label>
                                        <input
                                            type="text"
                                            placeholder="例: やまだ たろう"
                                            value={studentFormData.ruby}
                                            onChange={e => setStudentFormData({ ...studentFormData, ruby: e.target.value })}
                                            className="w-full px-3 py-1.5 text-sm border-2 border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>

                                    <div className="pt-2 flex justify-end space-x-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowRosterModal(false)}
                                            className="px-4 py-2 font-bold text-slate-600 bg-slate-100 rounded-xl text-xs"
                                        >
                                            キャンセル
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-4 py-2 font-bold text-white bg-teal-600 rounded-xl text-xs shadow"
                                        >
                                            {editingStudent ? '保存' : '追加'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 8. カスタム通知・確認ダイアログ */}
                    {dialogConfig && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50">
                            <div className="bg-white rounded-2xl p-5 border-2 border-slate-800 w-full max-w-sm text-center shadow-2xl">
                                <h3 className="font-bold text-slate-800 text-sm mb-2">
                                    {dialogConfig.title}
                                </h3>
                                <p className="text-xs font-bold text-slate-600 mb-4 whitespace-pre-wrap">
                                    {dialogConfig.message}
                                </p>
                                <div className="flex justify-center space-x-2">
                                    {dialogConfig.type === 'confirm' ? (
                                        <>
                                            <button
                                                onClick={() => setDialogConfig(null)}
                                                className="px-4 py-1.5 font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs"
                                            >
                                                いいえ
                                            </button>
                                            <button
                                                onClick={() => {
                                                    if (dialogConfig.onConfirm) dialogConfig.onConfirm();
                                                    setDialogConfig(null);
                                                }}
                                                className="px-4 py-1.5 font-bold text-white bg-rose-600 hover:bg-rose-700 rounded-xl text-xs shadow"
                                            >
                                                はい
                                            </button>
                                        </>
                                    ) : (
                                        <button
                                            onClick={() => setDialogConfig(null)}
                                            className="px-5 py-1.5 font-bold text-white bg-slate-800 hover:bg-slate-900 rounded-xl text-xs shadow"
                                        >
                                            OK
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
