    <!-- SafeStorage ラッパー (Google Sites / iframe 等での Storage アクセス拒否対策) -->
    <script>
        window.safeStorage = {
            _memory: {},
            getItem: function(key) {
                try {
                    return localStorage.getItem(key);
                } catch (e) {
                    return this._memory[key] || null;
                }
            },
            setItem: function(key, value) {
                try {
                    localStorage.setItem(key, value);
                } catch (e) {
                    this._memory[key] = value;
                }
            },
            removeItem: function(key) {
                try {
                    localStorage.removeItem(key);
                } catch (e) {
                    delete this._memory[key];
                }
            }
        };
    </script>

    <!-- Firebase SDK 11.6.1 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sch-check-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "demo-key",
                authDomain: "demo-project.firebaseapp.com",
                projectId: "demo-project",
                storageBucket: "demo-project.appspot.com",
                messagingSenderId: "123456789",
                appId: "1:123456789:web:abcdef123456"
              };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.FirebaseBridge = {
            initAuth: async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    return auth.currentUser;
                } catch (e) {
                    console.warn("Firebase Auth fallback:", e);
                    return null;
                }
            },
            db,
            appId,
            doc,
            setDoc,
            getDoc,
            collection,
            onSnapshot,

            // マスターデータ（持ち物・カテゴリ・プリセット・名簿・暗証番号）の送信
            saveMasterData: async (masterObj) => {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'master');
                    await setDoc(docRef, {
                        ...masterObj,
                        updatedAt: new Date().toISOString()
                    }, { merge: true });
                } catch (e) {
                    console.warn("Firestore save master error:", e);
                }
            },

            // マスターデータのリアルタイム監視
            listenMasterData: (callback) => {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'master');
                return onSnapshot(docRef, (snapshot) => {
                    if (snapshot.exists()) {
                        callback(snapshot.data());
                    }
                }, (err) => {
                    console.warn("Firestore master snapshot notice:", err);
                });
            },

            // 児童の提出状況保存
            saveSubmissionDoc: async (docId, subObj) => {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'submissions', docId);
                    await setDoc(docRef, subObj, { merge: true });
                } catch (e) {
                    console.warn("Firestore submission save error:", e);
                }
            }
        };
    </script>

        // 毎日15:00のカットオフ時刻計算
        const getResetCutoffTimestamp = (dateObj = new Date()) => {
            const cutoff = new Date(dateObj);
            cutoff.setHours(15, 0, 0, 0);
            if (dateObj < cutoff) {
                cutoff.setDate(cutoff.getDate() - 1);
            }
            return cutoff.getTime();
        };

        const getTodayKey = () => {
            const now = new Date();
            const cutoff = new Date(now);
            cutoff.setHours(15, 0, 0, 0);
            if (now < cutoff) {
                cutoff.setDate(cutoff.getDate() - 1);
            }
            return `${cutoff.getFullYear()}-${String(cutoff.getMonth() + 1).padStart(2, '0')}-${String(cutoff.getDate()).padStart(2, '0')}`;
        };

        function App() {
            // SafeStorage より初期値をロード（一度読み込まれたら決してリセットしない）
            const [categories, setCategories] = useState(() => {
                const saved = window.safeStorage.getItem('sch_chk_categories');
                return saved ? JSON.parse(saved) : INITIAL_CATEGORIES;
            });

            const [items, setItems] = useState(() => {
                const saved = window.safeStorage.getItem('sch_chk_items');
                return saved ? JSON.parse(saved) : INITIAL_ITEMS;
            });

            const [presets, setPresets] = useState(() => {
                const saved = window.safeStorage.getItem('sch_chk_presets');
                return saved ? JSON.parse(saved) : INITIAL_PRESET_LIST;
            });

            const [roster, setRoster] = useState(() => {
                const saved = window.safeStorage.getItem('sch_chk_roster');
                return saved ? JSON.parse(saved) : INITIAL_ROSTER;
            });

            const [passcode, setPasscode] = useState(() => {
                return window.safeStorage.getItem('sch_chk_passcode') || '1234';
            });

            const [lastResetTime, setLastResetTime] = useState(() => {
                const saved = window.safeStorage.getItem('sch_chk_last_reset');
                return saved ? Number(saved) : 0;
            });

            const [selectedStudentId, setSelectedStudentId] = useState(() => {
                const saved = window.safeStorage.getItem('sch_chk_selected_st');
                return saved || (roster[0]?.id || '');
            });

            const [submissions, setSubmissions] = useState(() => {
                const saved = window.safeStorage.getItem('sch_chk_submissions');
                return saved ? JSON.parse(saved) : {};
            });

            const [activeTab, setActiveTab] = useState('daily');
            const [isTeacherMode, setIsTeacherMode] = useState(false);
            const [activeView, setActiveView] = useState('list'); // 'list' | 'matrix'
            const [isBigDisplay, setIsBigDisplay] = useState(false);
            const [activeCategoryFilter, setActiveCategoryFilter] = useState('ALL');
            const [isFbReady, setIsFbReady] = useState(false);

            // モーダル管理ステート
            const [showPasscodeModal, setShowPasscodeModal] = useState(false);
            const [passcodeInput, setPasscodeInput] = useState('');
            const [passcodeError, setPasscodeError] = useState('');

            const [showChangePassModal, setShowChangePassModal] = useState(false);
            const [oldPassInput, setOldPassInput] = useState('');
            const [newPassInput, setNewPassInput] = useState('');
            const [confirmPassInput, setConfirmPassInput] = useState('');
            const [changePassError, setChangePassError] = useState('');

            const [showItemModal, setShowItemModal] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [itemFormData, setItemFormData] = useState({
                title: '', ruby: '', categoryId: 'cat-daily', tab: 'daily', quantity: '1個', note: ''
            });

            const [showCategoryModal, setShowCategoryModal] = useState(false);
            const [editingCategory, setEditingCategory] = useState(null);
            const [catFormData, setCatFormData] = useState({
                name: '', ruby: '', icon: 'fa-bag-shopping', colorIndex: 0
            });

            const [showSavePresetModal, setShowSavePresetModal] = useState(false);
            const [presetNameInput, setPresetNameInput] = useState('');
            const [presetRubyInput, setPresetRubyInput] = useState('');

            const [showPresetManagerModal, setShowPresetManagerModal] = useState(false);
            const [showRosterModal, setShowRosterModal] = useState(false);
            const [editingStudent, setEditingStudent] = useState(null);
            const [studentFormData, setStudentFormData] = useState({ number: 1, name: '', ruby: '' });

            const [dialogConfig, setDialogConfig] = useState(null);

            const COLOR_THEMES = [
                { color: 'bg-amber-100 border-amber-300 text-amber-900', badge: 'bg-amber-500 text-white', label: 'アンバー' },
                { color: 'bg-sky-100 border-sky-300 text-sky-900', badge: 'bg-sky-500 text-white', label: 'スカイブルー' },
                { color: 'bg-rose-100 border-rose-300 text-rose-900', badge: 'bg-rose-500 text-white', label: 'ローズ' },
                { color: 'bg-emerald-100 border-emerald-300 text-emerald-900', badge: 'bg-emerald-500 text-white', label: 'エメラルド' },
                { color: 'bg-purple-100 border-purple-300 text-purple-900', badge: 'bg-purple-500 text-white', label: 'パープル' },
                { color: 'bg-slate-100 border-slate-300 text-slate-900', badge: 'bg-slate-600 text-white', label: 'グレー' },
            ];

            const ICON_OPTIONS = [
                'fa-bag-shopping', 'fa-book-open', 'fa-file-signature', 'fa-star', 
                'fa-palette', 'fa-music', 'fa-volleyball', 'fa-flask', 'fa-pencil', 'fa-laptop'
            ];

            const todayKey = getTodayKey();

            // Firebase リアルタイム同期の初期化
            useEffect(() => {
                let unsubSubmissions = null;
                let unsubMaster = null;

                const setupFirebase = async () => {
                    if (window.FirebaseBridge) {
                        const { initAuth, db, appId, collection, onSnapshot, listenMasterData } = window.FirebaseBridge;
                        await initAuth();
                        setIsFbReady(true);

                        // A. クラウド上のマスターデータの受領
                        unsubMaster = listenMasterData((data) => {
                            if (!data) return;
                            if (data.categories && data.categories.length > 0) {
                                setCategories(data.categories);
                                window.safeStorage.setItem('sch_chk_categories', JSON.stringify(data.categories));
                            }
                            if (data.items && data.items.length > 0) {
                                setItems(prev => {
                                    const completedMap = new Map(prev.map(i => [i.id, i.completed]));
                                    const merged = data.items.map(it => ({
                                        ...it,
                                        completed: completedMap.has(it.id) ? completedMap.get(it.id) : false
                                    }));
                                    window.safeStorage.setItem('sch_chk_items', JSON.stringify(merged));
                                    return merged;
                                });
                            }
                            if (data.presets) {
                                setPresets(data.presets);
                                window.safeStorage.setItem('sch_chk_presets', JSON.stringify(data.presets));
                            }
                            if (data.roster && data.roster.length > 0) {
                                setRoster(data.roster);
                                window.safeStorage.setItem('sch_chk_roster', JSON.stringify(data.roster));
                            }
                            if (data.passcode) {
                                setPasscode(data.passcode);
                                window.safeStorage.setItem('sch_chk_passcode', data.passcode);
                            }
                        });

                        // B. 全児童のリアルタイム提出状況の受領
                        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'submissions');
                        unsubSubmissions = onSnapshot(colRef, (snapshot) => {
                            const newSubmissions = {};
                            snapshot.forEach((doc) => {
                                newSubmissions[doc.id] = doc.data();
                            });
                            setSubmissions(prev => {
                                const updated = { ...prev, ...newSubmissions };
                                window.safeStorage.setItem('sch_chk_submissions', JSON.stringify(updated));
                                return updated;
                            });
                        }, (err) => {
                            console.warn("Firestore submissions snapshot notice:", err);
                        });
                    }
                };
                setupFirebase();

                return () => {
                    if (unsubSubmissions) unsubSubmissions();
                    if (unsubMaster) unsubMaster();
                };
            }, []);

            // マスターデータ変更時の即時永続化保存関数
            const persistMasterData = (updatedObj) => {
                const masterObj = {
                    categories: updatedObj.categories !== undefined ? updatedObj.categories : categories,
                    items: updatedObj.items !== undefined ? updatedObj.items : items,
                    presets: updatedObj.presets !== undefined ? updatedObj.presets : presets,
                    roster: updatedObj.roster !== undefined ? updatedObj.roster : roster,
                    passcode: updatedObj.passcode !== undefined ? updatedObj.passcode : passcode,
                };

                // SafeStorage へ即時保存
                window.safeStorage.setItem('sch_chk_categories', JSON.stringify(masterObj.categories));
                window.safeStorage.setItem('sch_chk_items', JSON.stringify(masterObj.items));
                window.safeStorage.setItem('sch_chk_presets', JSON.stringify(masterObj.presets));
                window.safeStorage.setItem('sch_chk_roster', JSON.stringify(masterObj.roster));
                window.safeStorage.setItem('sch_chk_passcode', masterObj.passcode);

                // クラウド (Firestore) へ保存
                if (window.FirebaseBridge) {
                    window.FirebaseBridge.saveMasterData(masterObj);
                }
            };

            // 毎日15:00の自動リセット判定
            useEffect(() => {
                const nowCutoff = getResetCutoffTimestamp(new Date());
                if (lastResetTime < nowCutoff) {
                    setItems(prev => {
                        const resetItems = prev.map(item => item.tab === 'daily' ? { ...item, completed: false } : item);
                        window.safeStorage.setItem('sch_chk_items', JSON.stringify(resetItems));
                        return resetItems;
                    });
                    setLastResetTime(nowCutoff);
                    window.safeStorage.setItem('sch_chk_last_reset', String(nowCutoff));
                }
            }, [lastResetTime]);

            // 選択中の児童情報
            const currentSubKey = `${todayKey}_${selectedStudentId}`;
            const currentSubData = submissions[currentSubKey] || { checkedIds: [], isSubmitted: false, submittedAt: '' };

            // 児童選択の切り替え時のチェック状態同期
            useEffect(() => {
                if (!selectedStudentId) return;
                window.safeStorage.setItem('sch_chk_selected_st', selectedStudentId);
                const checkedSet = new Set(currentSubData.checkedIds || []);
                setItems(prev => prev.map(it => ({
                    ...it,
                    completed: checkedSet.has(it.id)
                })));
            }, [selectedStudentId, currentSubKey]);

            // カスタムダイアログ表示
            const showNotice = (title, message) => setDialogConfig({ type: 'notice', title, message });
            const showConfirm = (title, message, onConfirm) => setDialogConfig({ type: 'confirm', title, message, onConfirm });

            // 児童のチェック操作
            const toggleItemCheck = (id) => {
                if (isTeacherMode) return; // 先生モード中は誤タップ防止ロック
                setItems(prev => {
                    const nextItems = prev.map(item => item.id === id ? { ...item, completed: !item.completed } : item);
                    saveCurrentCheckState(nextItems, currentSubData.isSubmitted, currentSubData.submittedAt);
                    return nextItems;
                });
            };

            // チェック＆提出データの同期処理
            const saveCurrentCheckState = (updatedItems, isSubmittedStatus, submittedAtTime) => {
                if (!selectedStudentId) return;
                const checkedIds = updatedItems.filter(i => i.completed).map(i => i.id);
                const subObj = {
                    studentId: selectedStudentId,
                    dateKey: todayKey,
                    checkedIds,
                    isSubmitted: isSubmittedStatus,
                    submittedAt: submittedAtTime,
                    updatedAt: new Date().toISOString()
                };

                setSubmissions(prev => {
                    const updated = { ...prev, [currentSubKey]: subObj };
                    window.safeStorage.setItem('sch_chk_submissions', JSON.stringify(updated));
                    return updated;
                });

                if (window.FirebaseBridge) {
                    window.FirebaseBridge.saveSubmissionDoc(currentSubKey, subObj);
                }
            };

            // 先生のマトリクス表代理チェック
            const toggleMatrixCell = (stId, itemId) => {
                if (!isTeacherMode) return;
                const targetSubKey = `${todayKey}_${stId}`;
                const targetSub = submissions[targetSubKey] || { checkedIds: [], isSubmitted: false, submittedAt: '' };
                const checkedSet = new Set(targetSub.checkedIds || []);

                if (checkedSet.has(itemId)) {
                    checkedSet.delete(itemId);
                } else {
                    checkedSet.add(itemId);
                }

                const updatedSub = {
                    studentId: stId,
                    dateKey: todayKey,
                    checkedIds: Array.from(checkedSet),
                    isSubmitted: targetSub.isSubmitted,
                    submittedAt: targetSub.submittedAt,
                    updatedAt: new Date().toISOString()
                };

                setSubmissions(prev => {
                    const next = { ...prev, [targetSubKey]: updatedSub };
                    window.safeStorage.setItem('sch_chk_submissions', JSON.stringify(next));
                    return next;
                });

                if (window.FirebaseBridge) {
                    window.FirebaseBridge.saveSubmissionDoc(targetSubKey, updatedSub);
                }

                if (stId === selectedStudentId) {
                    setItems(prev => prev.map(it => ({
                        ...it,
                        completed: checkedSet.has(it.id)
                    })));
                }
            };

            const toggleMatrixSubmission = (stId) => {
                if (!isTeacherMode) return;
                const targetSubKey = `${todayKey}_${stId}`;
                const targetSub = submissions[targetSubKey] || { checkedIds: [], isSubmitted: false, submittedAt: '' };
                const now = new Date();
                const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                const updatedSub = {
                    ...targetSub,
                    studentId: stId,
                    dateKey: todayKey,
                    isSubmitted: !targetSub.isSubmitted,
                    submittedAt: !targetSub.isSubmitted ? timeStr : '',
                    updatedAt: new Date().toISOString()
                };

                setSubmissions(prev => {
                    const next = { ...prev, [targetSubKey]: updatedSub };
                    window.safeStorage.setItem('sch_chk_submissions', JSON.stringify(next));
                    return next;
                });

                if (window.FirebaseBridge) {
                    window.FirebaseBridge.saveSubmissionDoc(targetSubKey, updatedSub);
                }
            };

            // 児童「先生に提出する」

                const targetIdx = direction === 'up' ? idx - 1 : idx + 1;
                if (targetIdx < 0 || targetIdx >= items.length) return;
                const updated = [...items];
                const [moved] = updated.splice(idx, 1);
                updated.splice(targetIdx, 0, moved);
                setItems(updated);
                persistMasterData({ items: updated });
            };

                const idx = categories.findIndex(c => c.id === catId);
                if (idx < 0) return;
                const targetIdx = direction === 'up' ? idx - 1 : idx + 1;
                if (targetIdx < 0 || targetIdx >= categories.length) return;
                const updated = [...categories];
                const [moved] = updated.splice(idx, 1);
                updated.splice(targetIdx, 0, moved);

                persistMasterData({ categories: updated });

                                    </div>
                                    <div>
                                        <label className="block text-xs font-black text-slate-700 mb-1">数量</label>
                                        <input
                                            type="text"
                                            placeholder="例: 1個, 1冊"
                                            value={itemFormData.quantity}
                                            onChange={e => setItemFormData({ ...itemFormData, quantity: e.target.value })}
                                            className="w-full px-3.5 py-2 text-sm bg-slate-50 border-2 border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black text-slate-700 mb-1">
                                            注意事項メモ（改行可能）
                                        </label>
                                        <textarea
                                            rows="3"
                                            placeholder="例: 赤白帽子もわすれずに&#10;充電しておくこと"
                                            value={itemFormData.note}
                                            onChange={e => setItemFormData({ ...itemFormData, note: e.target.value })}
                                            className="w-full px-3.5 py-2 text-sm bg-slate-50 border-2 border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>

                                    <div className="pt-2 flex justify-end space-x-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowItemModal(false)}
                                            className="px-4 py-2 font-bold text-slate-600 bg-slate-100 rounded-xl text-xs"
                                        >
                                            キャンセル
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-5 py-2 font-bold text-white bg-amber-500 rounded-xl text-xs shadow"
                                        >
                                            {editingItem ? '保存する' : '追加する'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 4. カテゴリ追加・編集モーダル */}
                    {showCategoryModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40">
                            <div className="bg-white rounded-3xl border-4 border-purple-300 w-full max-w-md overflow-hidden shadow-xl">
                                <div className="px-6 py-4 bg-purple-100 border-b-2 border-purple-200 flex items-center justify-between">
                                    <h3 className="font-black text-purple-900 text-base">
                                        {editingCategory ? 'カテゴリの修正' : '新しいカテゴリの追加'}
                                    </h3>
                                    <button onClick={() => setShowCategoryModal(false)} className="text-purple-900 font-black">
                                        ✕
                                    </button>
                                </div>
                                <form onSubmit={handleCategoryFormSubmit} className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-xs font-black text-slate-700 mb-1">
                                            カテゴリ名 <span className="text-rose-500">*</span>
                                        </label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="例: 理科・社会"
                                            value={catFormData.name}
                                            onChange={e => setCatFormData({ ...catFormData, name: e.target.value })}
                                            className="w-full px-3.5 py-2 text-sm bg-slate-50 border-2 border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black text-slate-700 mb-1">ふりがな</label>
                                        <input
                                            type="text"
                                            placeholder="例: りか・しゃかい"
                                            value={catFormData.ruby}
                                            onChange={e => setCatFormData({ ...catFormData, ruby: e.target.value })}
                                            className="w-full px-3.5 py-2 text-sm bg-slate-50 border-2 border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-black text-slate-700 mb-1">アイコン</label>
                                        <div className="grid grid-cols-5 gap-2">
                                            {ICON_OPTIONS.map(icon => (
                                                <button
                                                    key={icon}
                                                    type="button"
                                                    onClick={() => setCatFormData({ ...catFormData, icon })}
                                                    className={`h-10 rounded-xl border-2 text-base flex items-center justify-center ${
                                                        catFormData.icon === icon
                                                            ? 'bg-purple-600 border-purple-600 text-white'
                                                            : 'bg-slate-50 border-slate-200 text-slate-700'
                                                    }`}
                                                >
                                                    <i className={`fa-solid ${icon}`}></i>
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-black text-slate-700 mb-1">カラーテーマ</label>
                                        <div className="grid grid-cols-3 gap-2">
                                            {COLOR_THEMES.map((theme, idx) => (
                                                <button
                                                    key={idx}
                                                    type="button"
                                                    onClick={() => setCatFormData({ ...catFormData, colorIndex: idx })}
                                                    className={`p-2 rounded-xl border-2 text-xs font-bold text-center ${
                                                        catFormData.colorIndex === idx
                                                            ? 'border-purple-600 ring-2 ring-purple-300'
                                                            : 'border-slate-200'
                                                    } ${theme.color.split(' ')[0]}`}
                                                >
                                                    {theme.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="pt-2 flex justify-end space-x-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowCategoryModal(false)}
                                            className="px-4 py-2 font-bold text-slate-600 bg-slate-100 rounded-xl text-xs"
                                        >
                                            キャンセル
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-5 py-2 font-bold text-white bg-purple-600 rounded-xl text-xs shadow"
                                        >
                                            {editingCategory ? '保存する' : '追加する'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 5. プリセット保存モーダル */}
                    {showSavePresetModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40">
                            <div className="bg-white rounded-3xl p-6 border-4 border-amber-300 w-full max-w-md shadow-xl">
                                <h3 className="font-black text-amber-900 text-lg mb-2">
                                    現在の「まいにちの持ち物」をプリセット保存
                                </h3>
                                <p className="text-xs text-slate-500 font-bold mb-4">
                                    現在登録されている持ち物（{items.filter(i => i.tab === 'daily').length}件）をテンプレートとして保存します。
                                </p>
                                <form onSubmit={handleSaveCurrentAsPreset} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-black text-slate-700 mb-1">
                                            プリセット名 <span className="text-rose-500">*</span>
                                        </label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="例: 水曜日セット（習字道具あり）"
                                            value={presetNameInput}
                                            onChange={e => setPresetNameInput(e.target.value)}
                                            className="w-full px-3.5 py-2 text-sm border-2 border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black text-slate-700 mb-1">ふりがな</label>
                                        <input
                                            type="text"
                                            placeholder="例: すいようびセット"
                                            value={presetRubyInput}
                                            onChange={e => setPresetRubyInput(e.target.value)}
                                            className="w-full px-3.5 py-2 text-sm border-2 border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>
                                    <div className="pt-2 flex justify-end space-x-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowSavePresetModal(false)}
                                            className="px-4 py-2 font-bold text-slate-600 bg-slate-100 rounded-xl text-xs"
                                        >
                                            キャンセル
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-5 py-2 font-bold text-white bg-amber-500 rounded-xl text-xs shadow"
                                        >
                                            保存する
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 6. プリセット管理モーダル */}
                    {showPresetManagerModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40">
                            <div className="bg-white rounded-3xl border-4 border-indigo-400 w-full max-w-lg overflow-hidden shadow-xl flex flex-col max-h-[85vh]">
                                <div className="px-6 py-4 bg-indigo-100 border-b-2 border-indigo-200 flex items-center justify-between">
                                    <h3 className="font-black text-indigo-900 text-base">
                                        曜日別・行事用 プリセットの管理
                                    </h3>
                                    <button onClick={() => setShowPresetManagerModal(false)} className="text-indigo-900 font-black">
                                        ✕
                                    </button>
                                </div>
                                <div className="p-6 overflow-y-auto space-y-3 flex-1">
                                    {presets.length === 0 ? (
                                        <p className="text-xs text-slate-400 font-bold text-center py-6">
                                            保存されたプリセットはありません
                                        </p>
                                    ) : (
                                        presets.map(p => (
                                            <div key={p.id} className="p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl flex items-center justify-between">
                                                <div>
                                                    <h4 className="font-black text-slate-800 text-sm">
                                                        {renderRubyText(p.name, p.ruby)}
                                                    </h4>
                                                    <p className="text-xs text-slate-500 font-bold mt-1">
                                                        アイテム: {p.items.length}件 ({p.items.map(i => i.title).slice(0, 3).join(', ')}{p.items.length > 3 ? '...' : ''})
                                                    </p>
                                                </div>
                                                <div className="flex items-center space-x-2">
                                                    <button
                                                        onClick={() => {
                                                            applyPreset(p.id);
                                                            setShowPresetManagerModal(false);
                                                        }}
                                                        className="px-3 py-1.5 bg-emerald-600 text-white font-bold text-xs rounded-xl shadow"
                                                    >
                                                        一括上書き適用
                                                    </button>
                                                    <button
                                                        onClick={() => deletePreset(p.id)}
                                                        className="px-3 py-1.5 bg-rose-100 text-rose-700 hover:bg-rose-200 font-bold text-xs rounded-xl"
                                                    >
                                                        削除
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                                <div className="p-4 bg-slate-100 border-t border-slate-200 flex justify-between items-center">
                                    <button
                                        onClick={() => {
                                            setShowPresetManagerModal(false);
                                            setShowSavePresetModal(true);
                                        }}
                                        className="text-xs font-bold text-indigo-700 underline"
                                    >
                                        + 今の「まいにちの持ち物」をプリセット追加
                                    </button>
                                    <button
                                        onClick={() => setShowPresetManagerModal(false)}
                                        className="px-5 py-2 bg-slate-800 text-white font-bold rounded-xl text-xs"
                                    >
                                        閉じる
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 7. 児童名簿モーダル */}
                    {showRosterModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40">
                            <div className="bg-white rounded-3xl border-4 border-teal-300 w-full max-w-sm overflow-hidden shadow-xl">
                                <div className="px-6 py-4 bg-teal-100 border-b-2 border-teal-200 flex items-center justify-between">
                                    <h3 className="font-black text-teal-900 text-base">
                                        {editingStudent ? '児童情報の修正' : '児童の追加'}
                                    </h3>
                                    <button onClick={() => setShowRosterModal(false)} className="text-teal-900 font-black">
                                        ✕
                                    </button>
                                </div>
                                <form onSubmit={handleStudentFormSubmit} className="p-6 space-y-3">
                                    <div>
                                        <label className="block text-xs font-black text-slate-700 mb-1">出席番号</label>
                                        <input
                                            type="number"
                                            required
                                            min="1"
                                            value={studentFormData.number}
                                            onChange={e => setStudentFormData({ ...studentFormData, number: e.target.value })}
                                            className="w-full px-3.5 py-2 text-sm border-2 border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black text-slate-700 mb-1">児童の氏名 <span className="text-rose-500">*</span></label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="例: 山田 たろう"
                                            value={studentFormData.name}
                                            onChange={e => setStudentFormData({ ...studentFormData, name: e.target.value })}
                                            className="w-full px-3.5 py-2 text-sm border-2 border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black text-slate-700 mb-1">ふりがな</label>
                                        <input
                                            type="text"
                                            placeholder="例: やまだ たろう"
                                            value={studentFormData.ruby}
                                            onChange={e => setStudentFormData({ ...studentFormData, ruby: e.target.value })}
                                            className="w-full px-3.5 py-2 text-sm border-2 border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>

                                    <div className="pt-3 flex justify-end space-x-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowRosterModal(false)}
                                            className="px-4 py-2 font-bold text-slate-600 bg-slate-100 rounded-xl text-xs"
                                        >
                                            キャンセル
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-5 py-2 font-bold text-white bg-teal-600 rounded-xl text-xs shadow"
                                        >
                                            {editingStudent ? '保存' : '追加'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 8. カスタム通知・確認ダイアログ */}
                    {dialogConfig && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50">
                            <div className="bg-white rounded-3xl p-6 border-4 border-slate-800 w-full max-w-sm text-center shadow-2xl">
                                <h3 className="font-black text-slate-800 text-base mb-2">
                                    {dialogConfig.title}
                                </h3>
                                <p className="text-xs font-bold text-slate-600 mb-6 whitespace-pre-wrap">
                                    {dialogConfig.message}
                                </p>
                                <div className="flex justify-center space-x-2">
                                    {dialogConfig.type === 'confirm' ? (
                                        <>
                                            <button
                                                onClick={() => setDialogConfig(null)}
                                                className="px-5 py-2 font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs"
                                            >
                                                いいえ
                                            </button>
                                            <button
                                                onClick={() => {
                                                    if (dialogConfig.onConfirm) dialogConfig.onConfirm();
                                                    setDialogConfig(null);
                                                }}
                                                className="px-5 py-2 font-bold text-white bg-rose-600 hover:bg-rose-700 rounded-xl text-xs shadow"
                                            >
                                                はい
                                            </button>
                                        </>
                                    ) : (
                                        <button
                                            onClick={() => setDialogConfig(null)}
                                            className="px-6 py-2 font-bold text-white bg-slate-800 hover:bg-slate-900 rounded-xl text-xs shadow"
                                        >
                                            OK
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
